name: Weekly Grants Report

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 8:00 AM UTC (adjust for your timezone) edit
  workflow_dispatch:      # Allow manual triggering
  push:
    branches:
      - main
jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies for svglite
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libcairo2-dev

      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            readr
            plyr
            here
            lubridate
            knitr
            svglite
            kableExtra
            tibble
            httr
            curl
            blastula
            rvest
            xml2
            janitor
            jsonlite
      - name: Run R script to download new pages
        run: Rscript download_pages.R
      - name: Run R script to fetch grants and save CSV
        run: Rscript Get_Opportunity_Updates.R
      - name: Run R script to fetch engagement opportunities and save CSV
        run: Rscript Get_Engagement_Opportunities.R
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      - name: Render Quarto site
        run: |
          quarto render
      - name: Configure GitHub credentials
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}

      - name: Commit and push report
        run: |
          git add docs/ GMRI_Grants.csv GMRI_Engagement_Opportunities.csv
          git commit -m "Auto-update report for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # Only ping Slack for the weekly scheduled run and manual runs -- pushes
      # (code/README changes) still refresh the site but stay quiet.
      - name: Notify Slack
        if: github.event_name != 'push'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          REPORT_DATE=$(date '+%B %d, %Y')
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          MESSAGE="*GMRI Weekly Opportunities Report* for ${REPORT_DATE}\nGrants: ${SITE_URL}/Opportunity_Report.html\nEngagement: ${SITE_URL}/Engagement_Report.html"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"${MESSAGE}\"}" \
            "$SLACK_WEBHOOK"
